# =========================================================
# APPLICATION
# =========================================================

spring.application.name=FinanceManagementSystem


# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Local  -> update
# Render -> validate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.show-sql=false


# =========================================================
# HIKARICP - DATABASE CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1


# =========================================================
# CORS
# =========================================================

# Local:
# CORS_ALLOWED_ORIGINS=http://localhost:5176

# Render:
# CORS_ALLOWED_ORIGINS=https://e-vyapar-crm.vercel.app

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5176}


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# JWT
# =========================================================

jwt.secretKey=${JWT_SECRET_KEY}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO


# =========================================================
# OPTIONAL LOCAL SECRETS FILE
# =========================================================

spring.config.import=optional:secrets.properties
