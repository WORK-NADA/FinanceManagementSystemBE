# DB(Database) information
spring.application.name=FinanceManagementSystem
spring.datasource.url =jdbc:mysql://localhost:3306/financemanagementsystem
spring.datasource.username = root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.password=${DB_PASSWORD}

#JPA(Java Persistence API)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#jwt.secretKey=${JWT_SECRET_KEY}


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#file where we can see logs
logging.file.name=logs/app.log


#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
 
# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175

spring.config.import=secrets.properties